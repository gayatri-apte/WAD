<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>College Portal Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        /* Sidebar */
        .sidebar {
            height: 100vh;
            background-color: #343a40;
            color: white;
            padding: 20px;
        }

        .sidebar a {
            color: white;
            display: block;
            margin: 10px 0;
            text-decoration: none;
        }

        .sidebar a:hover {
            color: #ffc107;
        }

        /* Pastel Cards */
        .card {
            border-radius: 15px;
            color: #333;
        }

        .pastel-blue { background-color: #5aa8e4; }
        .pastel-green { background-color: #9c99f9; }
        .pastel-yellow { background-color: #75d391; }
        .pastel-pink { background-color: #f1819d; }

        .header-title {
            font-weight: bold;
        }

        .settings-icon {
            font-size: 24px;
            cursor: pointer;
            margin-top: 10px;
        }

        .settings-icon:hover {
            color: #0d6efd;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">College Portal</a>

        <!-- Search Box -->
        <form class="d-flex ms-auto flex-column align-items-end">
            <div class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Search...">
                <button class="btn btn-warning">Search</button>
            </div>

            <!-- Settings Icon BELOW search -->
            <i class="bi bi-gear-fill text-white settings-icon" onclick="openSettings()"></i>
        </form>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar">
            <h4>Menu</h4>
            <a href="#">Dashboard</a>
            <a href="#">Students</a>
            <a href="#">Courses</a>
            <a href="#">Faculty</a>
            <a href="#">Exams</a>
            <a href="#">Results</a>
        </div>

        <!-- MAIN CONTENT -->
        <div class="col-md-10 p-4">

            <h2 class="header-title">Dashboard</h2>

            <!-- CARDS -->
            <div class="row mt-4">

                <div class="col-md-3">
                    <div class="card pastel-blue p-3">
                        <h5>Total Students</h5>
                        <h2>1200</h2>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card pastel-green p-3">
                        <h5>Courses</h5>
                        <h2>35</h2>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card pastel-yellow p-3">
                        <h5>Faculty</h5>
                        <h2>80</h2>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card pastel-pink p-3">
                        <h5>Pending Fees</h5>
                        <h2>150</h2>
                    </div>
                </div>

            </div>

            <!-- TABLE -->
            <div class="mt-5">
                <h4>Recent Students</h4>
                <table class="table table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Year</th>
                        </tr>
                    </thead>
                    <tbody id="studentTable">
                        <tr>
                            <td>Rahul Sharma</td>
                            <td>BCA</td>
                            <td>2nd Year</td>
                        </tr>
                        <tr>
                            <td>Priya Patil</td>
                            <td>BSc IT</td>
                            <td>3rd Year</td>
                        </tr>
                        <tr>
                            <td>Amit Joshi</td>
                            <td>BBA</td>
                            <td>1st Year</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<!-- JavaScript -->
<script>
    function openSettings() {
        alert("Settings page coming soon!");
    }

    // Search filter
    document.querySelector("input[type='search']").addEventListener("keyup", function() {
        let filter = this.value.toLowerCase();
        let rows = document.querySelectorAll("#studentTable tr");

        rows.forEach(row => {
            let text = row.innerText.toLowerCase();
            row.style.display = text.includes(filter) ? "" : "none";
        });
    });
</script>

</body>
</html>
