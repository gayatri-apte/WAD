<!DOCTYPE html>
<html>
    <head>
        <title>real estate</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet" href="style.css"> 
    </head>
    <body>
        <!--Navbar-->
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <span class="navbar-brand">Dream Homes</span>
            </div>
        </nav>

        <!--Header-->
        <header class="text-center text-white p-5 hero">
        <h1>Find Your Dream Home</h1>
        <p>Best properties at affordable prices</p>
        </header>

        <!--Properties-->
        <div class="container my-5">
            <div class="row">

                <!--property 1-->
                <div class="col-md-4">
                    <div class="card">
                        <img src="home.jpeg" class="card-img-top">
                        <div class="card-body">
                            <h5>2BHK Apartment</h5>
                            <p>Pune , Maharashtra</p>
                            <p>50 Lakhs</p>
                            <button class="btn btn-primary" onclick="contact()">Contact Us</button>
                    </div>
                </div>
            </div>
            <!--property 2-->
            <div class="col-md-4">
                <div class="card">
                    <img src="home2.jpeg" class="card-img-top">
                    <div class="card-body">
                        <h5>Luxury Villa</h5>
                        <p>Goa , India</p>
                        <p>1.5 Crores</p>
                        <button class="btn btn-primary" onclick="contact()">Contact Us</button>
                    </div>
                </div>
            </div>
            <!--Footer-->
            <footer class="bg-dark text-center text-white p-3">
            <p>© 2026 Dream Homes. All rights reserved.</p>
            </footer>

            <script src ="script.js"></script>
    </body>
</html>
