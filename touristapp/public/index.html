<!DOCTYPE html>
<html>
<head>
  <title>Tourist Places of India</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🌏 Tourist Places of India</h1>

<!-- Taj Mahal -->
<div class="place">
  <h2>Taj Mahal</h2>
  <div class="carousel">
    <img id="img1" src="https://source.unsplash.com/400x250/?tajmahal" />
    <button onclick="prev('img1', taj)">Prev</button>
    <button onclick="next('img1', taj)">Next</button>
  </div>
  <p>One of the Seven Wonders of the World located in Agra.</p>
</div>

<!-- Jaipur -->
<div class="place">
  <h2>Jaipur</h2>
  <div class="carousel">
    <img id="img2" src="https://source.unsplash.com/400x250/?jaipur" />
    <button onclick="prev('img2', jaipur)">Prev</button>
    <button onclick="next('img2', jaipur)">Next</button>
  </div>
  <p>Known as the Pink City of India.</p>
</div>

<!-- Goa -->
<div class="place">
  <h2>Goa</h2>
  <div class="carousel">
    <img id="img3" src="https://source.unsplash.com/400x250/?goa,beach" />
    <button onclick="prev('img3', goa)">Prev</button>
    <button onclick="next('img3', goa)">Next</button>
  </div>
  <p>Famous for beaches and nightlife.</p>
</div>

<!-- Kerala -->
<div class="place">
  <h2>Kerala</h2>
  <div class="carousel">
    <img id="img4" src="https://source.unsplash.com/400x250/?kerala,backwaters" />
    <button onclick="prev('img4', kerala)">Prev</button>
    <button onclick="next('img4', kerala)">Next</button>
  </div>
  <p>Known for backwaters and greenery.</p>
</div>

<script src="script.js"></script>
</body>
</html>
