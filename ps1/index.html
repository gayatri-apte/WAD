<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My City - Pune</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f0f8ff;
        }

        header {
            background-color: #343a40;
            color: white;
            padding: 20px;
            text-align: center;
        }

        footer {
            background-color: #343a40;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }

        .landmark {
            font-size: 22px;
            margin: 10px 0;
        }

        #infoBox {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            background-color: #ffffff;
            box-shadow: 0 0 10px gray;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">MyCity</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Landmarks</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- HEADER -->
<header>
    <h1>Welcome to Pune City</h1>
</header>

<div class="container mt-4">

    <!-- LANDMARK NAMES -->
    <h3>Famous Landmarks</h3>

    <p class="landmark" style="color:red; font-family:Georgia;">Shaniwar Wada</p>
    <p class="landmark" style="color:blue; font-family:cursive;">Aga Khan Palace</p>
    <p class="landmark" style="color:green; font-family:monospace;">Sinhagad Fort</p>

    <!-- BUTTONS -->
    <div class="mt-3">
        <button class="btn btn-primary" onclick="showInfo('wada')">Shaniwar Wada</button>
        <button class="btn btn-success" onclick="showInfo('palace')">Aga Khan Palace</button>
        <button class="btn btn-danger" onclick="showInfo('fort')">Sinhagad Fort</button>
    </div>

    <!-- INFO DISPLAY -->
    <div id="infoBox" class="mt-4">
        <h4>Click a button to see details</h4>
    </div>

</div>

<!-- FOOTER -->
<footer>
    <p>© 2026 MyCity Pune | Designed for Practical Exam</p>
</footer>

<!-- JAVASCRIPT -->
<script>
    function showInfo(place) {
        let content = "";

        if (place === "wada") {
            content = `
                <h3>Shaniwar Wada</h3>
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Shaniwarwada_Pune.jpg">
                <p>A historical fortification built in 1732 and a symbol of Pune's heritage.</p>
            `;
        }
        else if (place === "palace") {
            content = `
                <h3>Aga Khan Palace</h3>
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/0f/Aga_Khan_Palace.jpg">
                <p>Famous for its connection to Mahatma Gandhi and beautiful architecture.</p>
            `;
        }
        else if (place === "fort") {
            content = `
                <h3>Sinhagad Fort</h3>
                <img src="/Users/gayatriapte/work/gayatri/webd/ps1/sinhagad.jpg">
                <p>A popular trekking destination with historical significance.</p>
            `;
        }

        document.getElementById("infoBox").innerHTML = content;
    }
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
